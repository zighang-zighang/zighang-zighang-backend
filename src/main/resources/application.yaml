server:
  forward-headers-strategy: NATIVE
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  mvc:
    log-resolved-exception: false
  jpa:
    open-in-view: true
    properties:
      hibernate:
        default_batch_fetch_size: 100

popular:
  recruitment:
    view-weight: 0.2
    bookmark-weight: 0.3
    application-weight: 0.5
    view-hours: 24
    bookmark-hours: 48
    application-hours: 72

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    groups:
      enabled: true
  swagger-ui:
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: -1
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
  cache:
    disabled: true
